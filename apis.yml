aid: polars
name: Polars
description: 'Polars is a blazingly fast, open-source DataFrame library and query engine
  written in Rust, with first-party bindings for Python, Rust, Node.js, and R. It provides
  lazy and eager execution, streaming for larger-than-memory datasets, automatic query
  optimization, multi-threading, and the Apache Arrow columnar memory format. Polars
  Cloud extends the same DataFrame API to managed and on-premise distributed compute
  with zero code changes. The project is developed by pola-rs and backed by Accel and
  Bain Capital Ventures.'
